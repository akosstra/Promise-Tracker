<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promise Tracker inbox</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Inbox</h1>
        <p id="summary">Your captured commitments</p>
      </div>
      <div class="counts" id="counts"></div>
    </header>

    <main class="layout">
      <form class="composer" id="add-form">
        <label for="text">New promise</label>
        <textarea id="text" required placeholder="Paste or type the commitment"></textarea>
        <div class="row">
          <div>
            <label class="field-label" for="due">Due date</label>
            <input id="due" type="date" />
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">Add to inbox</button>
          <button class="btn ghost" type="button" id="export">Export JSON</button>
        </div>
      </form>

      <div class="filters" role="tablist" aria-label="Filter promises">
        <button class="filter" type="button" data-filter="open" aria-pressed="true">Open</button>
        <button class="filter" type="button" data-filter="kept" aria-pressed="false">Kept</button>
        <button class="filter" type="button" data-filter="broken" aria-pressed="false">Broken</button>
        <button class="filter" type="button" data-filter="all" aria-pressed="false">All</button>
      </div>

      <section class="list" id="list"></section>

      <section class="meetings" id="meetings" aria-label="Meeting transcripts"></section>
    </main>

    <script src="shared.js"></script>
    <script src="transcripts.js"></script>
    <script src="sidepanel.js"></script>
    <script src="meetings.js"></script>
  </body>
</html>
